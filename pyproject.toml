[project]
name = "sa-project"
version = "0.1.0"
description = "CENG8004 Project 2: modules without magnitude (Drosophila connectome)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "caveclient",
    "fafbseg",
    "neuprint-python",
    "navis",
    "pandas",
    "pyarrow",
    "numpy",
    "scipy",
    "networkx",
    "scikit-learn",
    "matplotlib",
    "duckdb",
    "python-dotenv",
    "pytest",
    "ipykernel",
    "nbformat>=5.11.1",
    "nbclient>=0.11.0",
]

[tool.uv]
package = false
# Intel macOS: cryptography >= 49 ships no x86_64 macOS wheel and would need Rust to build.
no-build-package = ["cryptography"]
constraint-dependencies = ["cryptography<49"]
